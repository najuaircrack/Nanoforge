name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install CPU Python and optional test capabilities
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,serve,tui,tokenizers,data,pretrained,export]"
      - name: Install web dependencies before offline workflow checks
        working-directory: web
        run: npm ci
      - name: Source and public workflows
        run: python scripts/check.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run lint
        working-directory: web

  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python fallback and native build tooling
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,tokenizers,native,data]"
      - name: Locked Rust behavior tests
        working-directory: native/nanoforge-tokenizers
        run: cargo test --locked
      - name: Build and install native extension
        run: python -m pip install ./native/nanoforge-tokenizers --no-build-isolation
      - name: Native and Python fallback interoperability
        run: python -m pytest -q tests/test_native_tokenizer.py tests/test_data_modernization.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Source archive, wheel and authored smoke fixture checks
        run: python -m pytest -q tests/test_release_modernization.py
      - name: Build release artifacts
        run: python -m build --no-isolation

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic private-context controls
        run: |
          mkdir -p data/facts .latticekin .unlazy
          printf synthetic-secret > .env
          printf synthetic-private > data/facts/private.jsonl
          printf synthetic-trace > .latticekin/private.json
      - name: Build source-only image
        run: docker build -t latticekin-ci .
      - name: Verify image excludes private state and exposes the real CLI
        run: |
          docker run --rm --entrypoint python latticekin-ci -c "from pathlib import Path; assert not any(Path(p).exists() for p in ['/app/.env', '/app/data', '/app/.latticekin', '/app/.unlazy']); import nanoforge"
          docker run --rm latticekin-ci --help
