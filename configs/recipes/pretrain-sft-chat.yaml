# Two-stage recipe: pretrain on raw text, then SFT into a chat model.
# Run with:  nanoforge pipeline --config configs/recipes/pretrain-sft-chat.yaml
#
# base_config supplies the shared model + defaults; each stage overlays only what changes.
# Stage N automatically loads the best checkpoint weights from stage N-1 (fresh optimizer).

base_config: configs/pipeline-base.yaml
output_dir: runs/pretrain-sft-chat

stages:
  - name: pretrain
    overrides:
      training:
        mode: pretrain
        run_name: pretrain
        max_steps: 4000
        learning_rate: 3.0e-4
        min_learning_rate: 3.0e-5
        warmup_ratio: 0.05
      data:
        mode: pretrain
        loss_masking: none
        assistant_only_loss: false
        train_path: data/packed/pretrain/train.bin
        val_path: data/packed/pretrain/val.bin

  - name: sft
    overrides:
      training:
        mode: chat
        run_name: sft
        max_steps: 2000
        learning_rate: 5.0e-5
        min_learning_rate: 5.0e-6
        warmup_ratio: 0.10
      data:
        mode: chat
        loss_masking: assistant_only
        assistant_only_loss: true
        train_path: data/packed/chat25m/train.bin
        val_path: data/packed/chat25m/val.bin
