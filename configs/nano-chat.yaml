model:
  vocab_size: 260
  max_seq_len: 256
  d_model: 192
  n_layers: 4
  n_heads: 4
  n_kv_heads: 4
  ffn_hidden_mult: 2.67
  dropout: 0.0
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  use_flash: false
  activation: swiglu
  block_type: transformer
  attention_backend: sdpa
  normalization: rmsnorm
  position_embedding: rope
  quantization_backend: none

training:
  mode: chat
  run_name: nano-chat
  output_dir: runs/nano-chat
  device: cpu
  seed: 1337
  max_steps: 1200
  batch_size: 32
  micro_batch_size: 32
  grad_accum_steps: 1
  learning_rate: 6.0e-4
  min_learning_rate: 6.0e-5
  warmup_ratio: 0.05
  optimizer: adamw
  scheduler: cosine
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  precision: fp32
  gradient_checkpointing: false
  eval_interval: 150
  eval_steps: 20
  save_interval: 400
  early_stopping_patience: 30
  log_interval: 25
  health_interval: 50
  sample_interval: 300
  sample_prompt: "<|system|>\nYou are Nano, Najwan's assistant.\n<|user|>\nwhat is my name?\n<|assistant|>\n"
  sample_max_new_tokens: 40
  low_memory: false
  tensorboard: false
  wandb: false
  distributed_backend: none

data:
  train_path: data/packed/nano-chat/train.bin
  val_path: data/packed/nano-chat/val.bin
  tokenizer_type: byte
  tokenizer_path: null
  seq_len: 256
  mode: chat
  loss_masking: assistant_only
  assistant_only_loss: true
  tokenizer_batch_size: 128
  num_workers: 0
  pin_memory: false

inference:
  mode: chat
  max_new_tokens: 64
  temperature: 0.7
  top_k: 40
  top_p: 0.9
  min_p: 0.05
  repetition_penalty: 1.1
  frequency_penalty: 0.1
  presence_penalty: 0.0
  no_repeat_ngram_size: 4
  stop_on_repetition: true
  repetition_window: 64
  repetition_threshold: 0.85
  deterministic: false
  mirostat: false
