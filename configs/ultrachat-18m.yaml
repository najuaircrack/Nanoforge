model:
  vocab_size: 32000
  max_seq_len: 2048

  d_model: 768
  n_layers: 16
  n_heads: 12
  n_kv_heads: 4

  ffn_hidden_mult: 3.5

  dropout: 0.1

  rope_theta: 500000.0
  norm_eps: 1.0e-5

  tie_embeddings: true

  use_flash: true

  activation: swiglu
  block_type: transformer
  attention_backend: sdpa

  normalization: rmsnorm
  position_embedding: rope

  quantization_backend: none

training:
  mode: chat

  run_name: ultrachat-100m
  output_dir: runs/ultrachat-100m

  seed: 1337

  max_steps: 150000

  batch_size: 32
  micro_batch_size: 1
  grad_accum_steps: 32

  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5

  warmup_ratio: 0.03

  optimizer: adamw
  scheduler: cosine

  weight_decay: 0.1

  betas: [0.9, 0.95]
  eps: 1.0e-8

  grad_clip: 1.0

  precision: bf16

  gradient_checkpointing: true

  eval_interval: 1000
  eval_steps: 50

  save_interval: 1000

  early_stopping_patience: 30

  log_interval: 10
  health_interval: 25

  low_memory: true

  tensorboard: true
  wandb: false

  distributed_backend: none

data:
  train_path: data/packed/ultrachat-100m-sft/train.bin
  val_path: data/packed/ultrachat-100m-sft/val.bin

  tokenizer_type: native-bpe
  tokenizer_path: data/tokenizers/ultrachat-32k.json

  seq_len: 2048

  mode: chat

  loss_masking: assistant_only
  assistant_only_loss: true

  tokenizer_batch_size: 512

  num_workers: 4
  pin_memory: true

inference:
  mode: chat

  max_new_tokens: 256

  temperature: 0.85

  top_k: 40
  top_p: 0.9
  min_p: 0.05

  repetition_penalty: 1.15
  frequency_penalty: 0.15
  presence_penalty: 0.05

  no_repeat_ngram_size: 6

  stop_on_repetition: true
  repetition_window: 128
  repetition_threshold: 0.82

  deterministic: false
  mirostat: true