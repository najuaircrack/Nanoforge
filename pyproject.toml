[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "latticekin"
version = "0.1.0"
description = "A local-first platform for building measurable AI agents on CPU and GPU."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Latticekin" }]
dependencies = [
  "torch>=2.6",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "cloudpickle>=3.0",
]

[project.optional-dependencies]
tokenizers = ["tokenizers>=0.15", "sentencepiece>=0.1.99"]
data = ["pyarrow>=15.0", "datasets>=2.18", "webdataset>=0.2.86"]
native = ["maturin>=1.5"]
serve = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "psutil>=5.9"]
tui = ["textual>=0.50"]
logging = ["tensorboard>=2.14", "wandb>=0.16"]
export = ["onnx>=1.15", "onnxruntime>=1.16", "onnxscript>=0.3"]
pretrained = ["transformers>=4.45,<6", "peft>=0.13", "accelerate>=0.34", "safetensors>=0.4", "tokenizers>=0.20"]
adaptation = ["transformers>=4.45,<6", "peft>=0.13", "accelerate>=0.34", "safetensors>=0.4", "tokenizers>=0.20"]
qlora = ["transformers>=4.45,<6", "peft>=0.13", "accelerate>=0.34", "bitsandbytes>=0.43"]
gguf = ["llama-cpp-python>=0.3"]
embeddings = ["sentence-transformers>=3"]
dev = ["pytest>=7.4", "ruff>=0.3", "httpx>=0.27", "build>=1.2", "setuptools>=77", "wheel>=0.43", "tomli>=2; python_version<'3.11'"]
all = [
  "tokenizers>=0.15", "sentencepiece>=0.1.99",
  "pyarrow>=15.0", "datasets>=2.18", "webdataset>=0.2.86",
  "maturin>=1.5", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "psutil>=5.9",
  "tensorboard>=2.14", "wandb>=0.16",
  "onnx>=1.15", "onnxruntime>=1.16", "onnxscript>=0.3", "textual>=0.50",
  "transformers>=4.45,<6", "peft>=0.13", "accelerate>=0.34", "safetensors>=0.4",
  "sentence-transformers>=3", "pytest>=7.4", "ruff>=0.3", "httpx>=0.27", "build>=1.2", "setuptools>=77", "wheel>=0.43",
  "tomli>=2; python_version<'3.11'",
]

[project.scripts]
latticekin = "nanoforge.cli:main"
nanoforge = "nanoforge.cli:main"

[project.entry-points."nanoforge.plugins"]
# Third-party packages may add a plugin entry point without editing Nanoforge.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nanoforge = ["py.typed", "web_dist/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
